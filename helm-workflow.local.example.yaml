# install 会拷贝到 `<AGENT_DIR>/helm-workflow.local.example.yaml`（示例，每次 install 刷新）
# 生效配置：`<AGENT_DIR>/helm-workflow.local.yaml`
#   - 首次 install 若不存在，自动从本文件拷贝创建
#   - 已存在则保留不动（install 不会覆盖用户配置）

# Apply/Fix 阶段 per-task 是否自动 commit（默认 false）
# true  → 每个 task review 通过 + 构建 exit code 0 后由工作流自动 `git commit`；
#         S1 启动前要求工作区干净；S6 校验 diff 仅含当前 task 声明文件
# false → 工作流不动 git index，不 commit、不打断用户：
#         · 不在 task 间提示用户 commit
#         · 不在下一 task 启动前校验工作区干净
#         · 不在 S6 校验 diff 范围
#         tasks.md / log.md / state 仍正常回写；commit 时机完全由用户决定
# 任一取值下，工作流都禁止自动 `git push`。
auto_commit: false

# Commit message 规范说明（自由文本，默认空）
# 仅在 auto_commit: true 时生效；auto_commit: false 时工作流不 commit，此项被忽略。
# - 留空：implementer 根据 diff 与 task 内容自由生成 message
# - 填写：将本字段原文作为约束传给 implementer，由其按团队规范产出 message
# 示例（任选其一或自行编写）：
#   commit_message_guidance: |
#     使用 Conventional Commits：<type>(<scope>): <subject>
#     type 限定 feat / fix / refactor / docs / chore / test，主语用中文。
#   commit_message_guidance: |
#     标题：[<Jira 号>] <动词开头的中文简述>
#     正文：列出主要变更点，每点一行。
#   commit_message_guidance: |
#     首行：feat[<分支名>]<change-name> <中文简述>
#     正文：可空。
commit_message_guidance: ""

# Feature 目录日期粒度（默认 "YYYY"）
# 控制 features/ 下日期前缀子目录的粒度：
#   "YYYY"   → features/2026/20260715_feature-name/
#   "YYYYMM" → features/2026/202607/20260715_feature-name/
# 团队年千级 feature 时建议设为 "YYYYMM" 以降低单目录文件数。
# 注意：存量 feature 不受影响；建议新建 workspace 时统一设定。
feature_date_granularity: "YYYY"

# CodeGraph 索引初始化（默认 true）
# true  → init Phase 3 对 workspace 中每个项目执行 codegraph init -i
# false → 跳过 CodeGraph 索引初始化
# 消费位置：skills/helm-workflow-init/SKILL.md（Bind 第 6 步 CodeGraph 触发处，锚点 `6. **CodeGraph**`）
codegraph_init: true

# ── 并发控制 ──
# git clone 最大并发数（默认 2）
# 消费位置：skills/helm-workflow-init/SKILL.md（Bind 第 4 步 `4. **执行顺序**` 与 S2 clone 步骤 `2. 仅有 git URL`）
clone_max_concurrency: 2
# git clone --depth（默认 1，控制浅克隆深度）
# 消费位置：skills/helm-workflow-init/SKILL.md（S2 clone 步骤 `2. 仅有 git URL`）
clone_depth: 1
# 项目分析探索子任务最大并发数（默认 5）
# 消费位置：skills/helm-workflow-explore/SKILL.md（S2 决策树提取并发上限）
explore_max_concurrency: 5
# codegraph init 最大并发数（默认 2）
# 消费位置：skills/helm-workflow-init/SKILL.md（S2b 并发度上限，锚点 `- 并发度 ≤ 2`）
codegraph_max_concurrency: 2

